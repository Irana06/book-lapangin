{{define "layout"}}<!doctype html>
<html lang="id">
<head>
  <title>{{.Title}} · Lapangin</title>
  {{template "head_assets"}}
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="wordmark">Lapangin</a>
      <nav class="site-nav" aria-label="Menu utama">
        <a href="/cek"{{if eq .Path "/cek"}} aria-current="page"{{end}}>Cek booking</a>
        {{template "theme_toggle"}}
      </nav>
    </div>
  </header>
  <main id="main" class="page">
    {{with .Flash}}<p class="notice notice-ok" role="status">{{.}}</p>{{end}}
    {{template "content" .}}
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Lapangin</span>
      <a href="/admin/login">Masuk pengelola</a>
    </div>
  </footer>
</body>
</html>{{end}}
