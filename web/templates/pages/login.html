{{define "content"}}
<section class="card card-narrow">
  <h1>Masuk pengelola</h1>
  <p class="muted">Khusus pemilik dan admin venue.</p>
  <form method="post" action="/admin/login" class="form">
    {{with .Error}}<p class="notice notice-error" role="alert">{{.}}</p>{{end}}
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{.Email}}" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Masuk</button>
  </form>
</section>
{{end}}
