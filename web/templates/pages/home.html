{{define "content"}}
<h1>Pilih tempat main</h1>
{{if .Venues}}
<ul class="venue-list">
  {{range .Venues}}
  <li>
    <a class="venue-link" href="/v/{{.Slug}}">
      <strong>{{.Name}}</strong>
      {{if .Address}}<span class="muted">{{.Address}}</span>{{end}}
    </a>
  </li>
  {{end}}
</ul>
{{else}}
<p class="empty">Belum ada tempat yang terdaftar.</p>
{{end}}
{{end}}
