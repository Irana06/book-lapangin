{{define "content"}}
<header class="page-head">
  <h1>Pilih tempat main</h1>
  <p class="lead">Lihat jadwal kosong dan booking langsung tanpa menunggu balasan chat.</p>
</header>

{{if .Venues}}
<ul class="venue-list">
  {{range .Venues}}
  <li>
    <a class="venue-row" href="/v/{{.Slug}}">
      <span class="venue-row-main">
        <strong>{{.Name}}</strong>
        {{if .Address}}<span class="muted">{{.Address}}</span>{{end}}
      </span>
      <span class="venue-row-cta">Lihat jadwal</span>
    </a>
  </li>
  {{end}}
</ul>
{{else}}
<p class="empty">Belum ada tempat yang terdaftar.</p>
{{end}}
{{end}}
